<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1950" viewBox="0 0 1440 1950"><rect width="1440" height="1950" fill="#f5f7fb"/><g font-family="Arial, sans-serif"><text x="50" y="48" font-size="28" font-weight="700" fill="#081b59">Kelmetrik V1 · Layout wireframes</text><text x="50" y="78" font-size="15" fill="#596981">Content hierarchy and responsive intent — schematic, not a browser rendering.</text><text x="50" y="123" font-size="19" font-weight="700">Desktop · 1440 px target</text><text x="1010" y="123" font-size="19" font-weight="700">Mobile · 360–390 px target</text><rect x="50" y="145" width="900" height="85" rx="10" fill="white" stroke="#cbd8ed"/><text x="70" y="175" font-size="17" font-weight="700" fill="#12328d">Kelmetrik</text><text x="70" y="201" font-size="13" fill="#3c4b65">Navigation anchors                                      EN / ES     Contact</text><rect x="50" y="250" width="900" height="139" rx="10" fill="#eff5ff" stroke="#cbd8ed"/><text x="70" y="280" font-size="17" font-weight="700" fill="#12328d">01 · Hero</text><text x="70" y="306" font-size="13" fill="#3c4b65">Connected operations. Better decisions.</text><text x="70" y="329" font-size="13" fill="#3c4b65">Value proposition + contact / explore actions</text><text x="70" y="352" font-size="13" fill="#3c4b65">Equipment → systems → people → operational context</text><rect x="50" y="407" width="900" height="116" rx="10" fill="white" stroke="#cbd8ed"/><text x="70" y="437" font-size="17" font-weight="700" fill="#12328d">02 · Operational disconnect</text><text x="70" y="463" font-size="13" fill="#3c4b65">One process, two views: fragmented and connected</text><text x="70" y="486" font-size="13" fill="#3c4b65">Labels explain handoffs, repeated entry and traceability</text><rect x="50" y="541" width="900" height="162" rx="10" fill="#eff5ff" stroke="#cbd8ed"/><text x="70" y="571" font-size="17" font-weight="700" fill="#12328d">03 · Connected operation — EOL</text><text x="70" y="597" font-size="13" fill="#3c4b65">Permanent simulation / synthetic data label</text><text x="70" y="620" font-size="13" fill="#3c4b65">Normal / failure selector • Start • Previous / Next • Reset</text><text x="70" y="643" font-size="13" fill="#3c4b65">Desktop: six-step rail + current transfer + evidence panel</text><text x="70" y="666" font-size="13" fill="#3c4b65">Final record: work order, identity, test, rule and disposition</text><rect x="50" y="721" width="900" height="162" rx="10" fill="white" stroke="#cbd8ed"/><text x="70" y="751" font-size="17" font-weight="700" fill="#12328d">04 · What we build</text><text x="70" y="777" font-size="13" fill="#3c4b65">Manufacturing &amp; traceability → EOL demo</text><text x="70" y="800" font-size="13" fill="#3c4b65">Quality / Safe Launch → evidence and disposition storyboard</text><text x="70" y="823" font-size="13" fill="#3c4b65">APQP → blocked milestone and missing evidence</text><text x="70" y="846" font-size="13" fill="#3c4b65">Warehouse → scan, material and quantity validation</text><rect x="50" y="901" width="900" height="116" rx="10" fill="white" stroke="#cbd8ed"/><text x="70" y="931" font-size="17" font-weight="700" fill="#12328d">05 · Beyond the machine</text><text x="70" y="957" font-size="13" fill="#3c4b65">Signal → serial + order → rule → event → investigation</text><text x="70" y="980" font-size="13" fill="#3c4b65">Integration depends on the interfaces available on the equipment</text><rect x="50" y="1035" width="900" height="116" rx="10" fill="white" stroke="#cbd8ed"/><text x="70" y="1065" font-size="17" font-weight="700" fill="#12328d">06 · Our approach</text><text x="70" y="1091" font-size="13" fill="#3c4b65">Understand → Design → Build → Validate → Deploy</text><text x="70" y="1114" font-size="13" fill="#3c4b65">One concrete activity and deliverable per stage</text><rect x="50" y="1169" width="900" height="139" rx="10" fill="#eff5ff" stroke="#cbd8ed"/><text x="70" y="1199" font-size="17" font-weight="700" fill="#12328d">07 · Contact</text><text x="70" y="1225" font-size="13" fill="#3c4b65">Name • work email • company • optional operational challenge</text><text x="70" y="1248" font-size="13" fill="#3c4b65">Inline error retains text / persistent accepted confirmation</text><text x="70" y="1271" font-size="13" fill="#3c4b65">Privacy link + alternative commercial email</text><rect x="50" y="1326" width="900" height="116" rx="10" fill="white" stroke="#cbd8ed"/><text x="70" y="1356" font-size="17" font-weight="700" fill="#12328d">Footer</text><text x="70" y="1382" font-size="13" fill="#3c4b65">Language links • privacy • measurement preferences</text><text x="70" y="1405" font-size="13" fill="#3c4b65">No disconnected newsletter input</text><rect x="1010" y="145" width="380" height="85" rx="10" fill="white" stroke="#cbd8ed"/><text x="1030" y="175" font-size="17" font-weight="700" fill="#12328d">Kelmetrik</text><text x="1030" y="201" font-size="13" fill="#3c4b65">EN / ES                         Menu disclosure</text><rect x="1010" y="250" width="380" height="158" rx="10" fill="white" stroke="#cbd8ed"/><text x="1030" y="280" font-size="17" font-weight="700" fill="#12328d">Hero</text><text x="1030" y="306" font-size="13" fill="#3c4b65">Headline wraps naturally</text><text x="1030" y="329" font-size="13" fill="#3c4b65">Short proposition</text><text x="1030" y="352" font-size="13" fill="#3c4b65">Stacked primary / secondary actions</text><text x="1030" y="375" font-size="13" fill="#3c4b65">Vertical connection diagram</text><rect x="1010" y="426" width="380" height="135" rx="10" fill="white" stroke="#cbd8ed"/><text x="1030" y="456" font-size="17" font-weight="700" fill="#12328d">Operational disconnect</text><text x="1030" y="482" font-size="13" fill="#3c4b65">Fragmented process</text><text x="1030" y="505" font-size="13" fill="#3c4b65">Connected process</text><text x="1030" y="528" font-size="13" fill="#3c4b65">Explanatory labels</text><rect x="1010" y="579" width="380" height="250" rx="10" fill="#eff5ff" stroke="#cbd8ed"/><text x="1030" y="609" font-size="17" font-weight="700" fill="#12328d">EOL simulation</text><text x="1030" y="635" font-size="13" fill="#3c4b65">Synthetic data label stays visible</text><text x="1030" y="658" font-size="13" fill="#3c4b65">Scenario selector + Start</text><text x="1030" y="681" font-size="13" fill="#3c4b65">Vertical stage list</text><text x="1030" y="704" font-size="13" fill="#3c4b65">Current transfer and explanation</text><text x="1030" y="727" font-size="13" fill="#3c4b65">Evidence below current stage</text><text x="1030" y="750" font-size="13" fill="#3c4b65">Thumb-accessible Previous / Next</text><text x="1030" y="773" font-size="13" fill="#3c4b65">Status includes words + icon</text><text x="1030" y="796" font-size="13" fill="#3c4b65">Final evidence + contact action</text><rect x="1010" y="847" width="380" height="112" rx="10" fill="white" stroke="#cbd8ed"/><text x="1030" y="877" font-size="17" font-weight="700" fill="#12328d">Domains</text><text x="1030" y="903" font-size="13" fill="#3c4b65">Four stacked editorial blocks</text><text x="1030" y="926" font-size="13" fill="#3c4b65">Native expandable storyboards</text><rect x="1010" y="977" width="380" height="89" rx="10" fill="white" stroke="#cbd8ed"/><text x="1030" y="1007" font-size="17" font-weight="700" fill="#12328d">Beyond the machine</text><text x="1030" y="1033" font-size="13" fill="#3c4b65">Vertical labeled signal flow</text><rect x="1010" y="1084" width="380" height="89" rx="10" fill="white" stroke="#cbd8ed"/><text x="1030" y="1114" font-size="17" font-weight="700" fill="#12328d">Approach</text><text x="1030" y="1140" font-size="13" fill="#3c4b65">Five stacked stages + deliverables</text><rect x="1010" y="1191" width="380" height="135" rx="10" fill="white" stroke="#cbd8ed"/><text x="1030" y="1221" font-size="17" font-weight="700" fill="#12328d">Contact</text><text x="1030" y="1247" font-size="13" fill="#3c4b65">Full-width labeled inputs</text><text x="1030" y="1270" font-size="13" fill="#3c4b65">Error / success in reading order</text><text x="1030" y="1293" font-size="13" fill="#3c4b65">Submit locked while sending</text><rect x="1010" y="1344" width="380" height="89" rx="10" fill="white" stroke="#cbd8ed"/><text x="1030" y="1374" font-size="17" font-weight="700" fill="#12328d">Footer</text><text x="1030" y="1400" font-size="13" fill="#3c4b65">Language • privacy • preferences</text><text x="50" y="1855" font-size="17" font-weight="700" fill="#12328d">Behavior and acceptance</text><text x="50" y="1885" font-size="14" fill="#3c4b65">Readable without animation • reduced motion • keyboard focus • no horizontal overflow • useful prerendered content without JavaScript</text><text x="50" y="1910" font-size="14" fill="#3c4b65">EOL: 2.51 V accepted / 2.72 V Quality Hold • inclusive 2.40–2.60 V • backtracking does not append operational events</text></g></svg>