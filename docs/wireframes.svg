<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1860" viewBox="0 0 1440 1860"><rect width="1440" height="1860" fill="#f5f7fb"/><g font-family="Arial, sans-serif"><text x="50" y="48" font-size="28" font-weight="700" fill="#081b59">Kelmetrik V1 · Revision 2 wireframes</text><text x="50" y="78" font-size="15" fill="#596981">Schematic content hierarchy — not a browser rendering. All four solution examples are visible.</text><text x="50" y="123" font-size="19" font-weight="700">Desktop · 1440 px target</text><text x="1010" y="123" font-size="19" font-weight="700">Mobile · 360–390 px target</text><rect x="50" y="145" width="900" height="89" rx="10" fill="white" stroke="#cbd8ed"/><text x="70" y="175" font-size="17" font-weight="700" fill="#12328d">Header</text><text x="70" y="202" font-size="13" fill="#3c4b65">Kelmetrik • Solutions • IT/OT • Approach • Contact • EN/ES</text><rect x="50" y="248" width="900" height="137" rx="10" fill="#eff5ff" stroke="#cbd8ed"/><text x="70" y="278" font-size="17" font-weight="700" fill="#12328d">Hero</text><text x="70" y="305" font-size="13" fill="#3c4b65">Centered value proposition and two actions</text><text x="70" y="329" font-size="13" fill="#3c4b65">Restored animated blue bars, soft trend and particles behind content</text><text x="70" y="353" font-size="13" fill="#3c4b65">No metric values • decorative only • pauses outside view</text><rect x="50" y="399" width="900" height="89" rx="10" fill="white" stroke="#cbd8ed"/><text x="70" y="429" font-size="17" font-weight="700" fill="#12328d">Operational disconnect</text><text x="70" y="456" font-size="13" fill="#3c4b65">Fragmented vs connected process with explanatory labels</text><rect x="50" y="502" width="900" height="137" rx="10" fill="#eff5ff" stroke="#cbd8ed"/><text x="70" y="532" font-size="17" font-weight="700" fill="#12328d">Solutions: manufacturing</text><text x="70" y="559" font-size="13" fill="#3c4b65">Left: challenge → what Kelmetrik builds → what it enables</text><text x="70" y="583" font-size="13" fill="#3c4b65">Right: order + station + product history with linked evidence</text><text x="70" y="607" font-size="13" fill="#3c4b65">Conceptual example label • contextual contact link</text><rect x="50" y="653" width="900" height="113" rx="10" fill="#eff5ff" stroke="#cbd8ed"/><text x="70" y="683" font-size="17" font-weight="700" fill="#12328d">Solutions: quality</text><text x="70" y="710" font-size="13" fill="#3c4b65">Left: challenge, implementation and operational use</text><text x="70" y="734" font-size="13" fill="#3c4b65">Right: finding + evidence + containment + owner + pending disposition</text><rect x="50" y="780" width="900" height="113" rx="10" fill="#eff5ff" stroke="#cbd8ed"/><text x="70" y="810" font-size="17" font-weight="700" fill="#12328d">Solutions: APQP</text><text x="70" y="837" font-size="13" fill="#3c4b65">Left: challenge, implementation and operational use</text><text x="70" y="861" font-size="13" fill="#3c4b65">Right: milestone dependency + report awaiting approval + owner</text><rect x="50" y="907" width="900" height="113" rx="10" fill="#eff5ff" stroke="#cbd8ed"/><text x="70" y="937" font-size="17" font-weight="700" fill="#12328d">Solutions: materials</text><text x="70" y="964" font-size="13" fill="#3c4b65">Left: challenge, implementation and operational use</text><text x="70" y="988" font-size="13" fill="#3c4b65">Right: order vs scan comparison + discrepancy prevents movement</text><rect x="50" y="1034" width="900" height="89" rx="10" fill="white" stroke="#cbd8ed"/><text x="70" y="1064" font-size="17" font-weight="700" fill="#12328d">Beyond the machine</text><text x="70" y="1091" font-size="13" fill="#3c4b65">Signal → production context → operational event → people</text><rect x="50" y="1137" width="900" height="113" rx="10" fill="white" stroke="#cbd8ed"/><text x="70" y="1167" font-size="17" font-weight="700" fill="#12328d">Our approach</text><text x="70" y="1194" font-size="13" fill="#3c4b65">Understand → Design → Build → Validate → Deploy</text><text x="70" y="1218" font-size="13" fill="#3c4b65">Concrete activity and deliverable for each stage</text><rect x="50" y="1264" width="900" height="113" rx="10" fill="white" stroke="#cbd8ed"/><text x="70" y="1294" font-size="17" font-weight="700" fill="#12328d">Contact and footer</text><text x="70" y="1321" font-size="13" fill="#3c4b65">Name, work email, company, optional challenge • alternate email</text><text x="70" y="1345" font-size="13" fill="#3c4b65">Privacy • EN/ES • accessible analytics preferences dialog</text><rect x="1010" y="145" width="380" height="89" rx="10" fill="white" stroke="#cbd8ed"/><text x="1030" y="175" font-size="17" font-weight="700" fill="#12328d">Header</text><text x="1030" y="202" font-size="13" fill="#3c4b65">Logo • EN/ES • Menu</text><rect x="1010" y="248" width="380" height="137" rx="10" fill="white" stroke="#cbd8ed"/><text x="1030" y="278" font-size="17" font-weight="700" fill="#12328d">Hero</text><text x="1030" y="305" font-size="13" fill="#3c4b65">Wrapped heading + short introduction</text><text x="1030" y="329" font-size="13" fill="#3c4b65">Stacked calls to action</text><text x="1030" y="353" font-size="13" fill="#3c4b65">Blue bars behind the content</text><rect x="1010" y="399" width="380" height="89" rx="10" fill="white" stroke="#cbd8ed"/><text x="1030" y="429" font-size="17" font-weight="700" fill="#12328d">Operational disconnect</text><text x="1030" y="456" font-size="13" fill="#3c4b65">Labeled flows stacked vertically</text><rect x="1010" y="502" width="380" height="137" rx="10" fill="#eff5ff" stroke="#cbd8ed"/><text x="1030" y="532" font-size="17" font-weight="700" fill="#12328d">Manufacturing</text><text x="1030" y="559" font-size="13" fill="#3c4b65">Explanation first</text><text x="1030" y="583" font-size="13" fill="#3c4b65">Annotated traceability record below</text><text x="1030" y="607" font-size="13" fill="#3c4b65">Contact link + conceptual label</text><rect x="1010" y="653" width="380" height="137" rx="10" fill="#eff5ff" stroke="#cbd8ed"/><text x="1030" y="683" font-size="17" font-weight="700" fill="#12328d">Quality</text><text x="1030" y="710" font-size="13" fill="#3c4b65">Explanation first</text><text x="1030" y="734" font-size="13" fill="#3c4b65">Finding / evidence / owner / disposition</text><text x="1030" y="758" font-size="13" fill="#3c4b65">No hidden or simulated controls</text><rect x="1010" y="804" width="380" height="113" rx="10" fill="#eff5ff" stroke="#cbd8ed"/><text x="1030" y="834" font-size="17" font-weight="700" fill="#12328d">APQP</text><text x="1030" y="861" font-size="13" fill="#3c4b65">Explanation first</text><text x="1030" y="885" font-size="13" fill="#3c4b65">Blocked milestone and missing approval</text><rect x="1010" y="931" width="380" height="113" rx="10" fill="#eff5ff" stroke="#cbd8ed"/><text x="1030" y="961" font-size="17" font-weight="700" fill="#12328d">Materials</text><text x="1030" y="988" font-size="13" fill="#3c4b65">Explanation first</text><text x="1030" y="1012" font-size="13" fill="#3c4b65">Readable compact order/scan table</text><rect x="1010" y="1058" width="380" height="89" rx="10" fill="white" stroke="#cbd8ed"/><text x="1030" y="1088" font-size="17" font-weight="700" fill="#12328d">Beyond the machine</text><text x="1030" y="1115" font-size="13" fill="#3c4b65">Vertical signal-to-context flow</text><rect x="1010" y="1161" width="380" height="89" rx="10" fill="white" stroke="#cbd8ed"/><text x="1030" y="1191" font-size="17" font-weight="700" fill="#12328d">Approach</text><text x="1030" y="1218" font-size="13" fill="#3c4b65">Five stages and deliverables</text><rect x="1010" y="1264" width="380" height="161" rx="10" fill="white" stroke="#cbd8ed"/><text x="1030" y="1294" font-size="17" font-weight="700" fill="#12328d">Contact and preferences</text><text x="1030" y="1321" font-size="13" fill="#3c4b65">Full-width labeled inputs</text><text x="1030" y="1345" font-size="13" fill="#3c4b65">Footer opens native modal dialog</text><text x="1030" y="1369" font-size="13" fill="#3c4b65">Accept / reject before measuring</text><text x="1030" y="1393" font-size="13" fill="#3c4b65">Preview explains no statistics are sent</text><text x="50" y="1790" font-size="17" font-weight="700" fill="#12328d">Acceptance</text><text x="50" y="1820" font-size="14" fill="#3c4b65">Readable without JavaScript or movement • explicit example labels • keyboard access • no horizontal overflow • consent before analytics</text></g></svg>